[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    auth: Authentication tests
    categories: Category tests
    transactions: Transaction tests
    budgets: Budget tests
    analytics: Analytics tests
    authorization: Cross-user authorization tests